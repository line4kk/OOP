<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunFunctions | Вход или регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grid">
    <section class="card hero">
        <h1>Добро пожаловать в FunFunctions - программу по работе с функциями</h1>
        <p class="active">Здесь реализовано:</p>
        <ul class="features">
            <li>Создание функций</li>
            <li>Изменение функций и их точек</li>
            <li>Просмотр графиков функций</li>
            <li>Различные операции над функциями</li>
        </ul>
    </section>
    <section class="card form-card">
        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="login" role="tab" aria-selected="true">Вход</button>
            <button class="tab" data-tab="register" role="tab" aria-selected="false">Регистрация</button>
        </div>

        <form id="loginForm" autocomplete="on" class="stacked-form">
            <div class="row">
                <label for="login-username">Имя пользователя</label>
                <input id="login-username" name="username" type="text" minlength="3" required placeholder="Существующий пользователь">
            </div>
            <div class="row">
                <label for="login-password">Пароль</label>
                <input id="login-password" name="password" type="password" minlength="8" required placeholder="••••••••">
            </div>
            <button type="submit">Войти</button>
        </form>

        <form id="registerForm" class="hidden stacked-form" autocomplete="on">
            <div class="row">
                <label for="reg-username">Имя пользователя</label>
                <input id="reg-username" name="username" type="text" minlength="3" required placeholder="Новый пользователь">
            </div>
            <div class="row">
                <label for="reg-password">Пароль (8-64 символа)</label>
                <input id="reg-password" name="password" type="password" minlength="8" maxlength="64" required placeholder="Придумайте надежный пароль">
            </div>
            <div class="row">
                <label for="reg-factory">Тип фабрики</label>
                <select id="reg-factory" name="factory_type" required>
                    <option value="linked_list">Связный список</option>
                    <option value="array">Динамический массив</option>
                </select>
            </div>
            <button type="submit">Создать аккаунт</button>
        </form>

        <div id="feedback" class="feedback" role="status"></div>

        <div id="result" class="result hidden" aria-live="polite">
            <div class="result-header">Авторизация прошла успешно</div>
            <p id="result-body" class="result-body"></p>
        </div>
    </section>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
