          password: '123456'
          role: user
          factoryType: linked_list
      required:
        - username
        - password
        - role
        - factory_type
      properties:
        username:
          type: string
          x-stoplight:
            id: 187du6ctn30f4
          example: Andrey
        password:
          type: string
          x-stoplight:
            id: abg4cjatfv24y
          example: '12345678'
          format: password
          minLength: 8
          maxLength: 64
        role:
          x-stoplight:
            id: to98g2mvewiig
          enum:
            - user
            - admin
        factory_type:
          x-stoplight:
            id: qmn2vlfqpqdvi
          enum:
            - linked_list
            - array
    FunctionCreateRequest:
      title: FunctionCreateRequest
      x-stoplight:
        id: shaa3srpp4oa9
      type: object
      description: Создание новой функции пользователем
      required:
