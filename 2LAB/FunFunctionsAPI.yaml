        - type
        - source
      properties:
        name:
          type: string
          x-stoplight:
            id: fcu2hzkkidred
          example: MyFunction
        type:
          x-stoplight:
            id: ox404otmiveim
          enum:
            - linked_list_tabulated
            - array_tabulated
            - analytical
        source:
          x-stoplight:
            id: x6wwtyc5ohqff
          enum:
            - base
            - operation
            - composite
      examples:
        - name: MyFunction
          type: linked_list_tabulated
          source: base
    FunctionSamplingRequest:
      title: FunctionSamplingRequest
      x-stoplight:
        id: uigdm5hfxiziz
      type: object
      required:
        - function_id
        - analytical_function_id
        - x_from
        - x_to
        - count
      properties:
        function_id:
          type: integer
          x-stoplight:
            id: vpftwlmjbhryc
          format: int64
          example: 52356
        analytical_function_id:
          type: integer
          x-stoplight:
            id: cubg5684ophy0
          format: int64
          example: 858176996
        x_from:
          type: number
          x-stoplight:
            id: u383m0os6owdf
          format: double
          example: 3
        x_to:
          type: number
          x-stoplight:
            id: w1d6pp7ps2xj3
          format: double
          example: 10
        count:
          type: integer
          x-stoplight:
            id: 8rv6goriuwumu
          minimum: 2
          example: 20
      examples:
        - name: FunctionCreatedBySampling
          analytical_function_id: 858176996
          x_from: 3
          x_to: 10
          count: 20
