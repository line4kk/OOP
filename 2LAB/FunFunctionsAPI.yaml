        - username: Andrey
          password: '123456'
      description: Данные для аутентицифкации пользователя
      required:
        - username
        - password
      properties:
        username:
          type: string
          x-stoplight:
            id: f1pcp8anogpue
          example: Andrey
        password:
          type: string
          x-stoplight:
            id: j2w75f4p5gcxk
          format: password
          example: '123456'
    UserRegisterRequest:
      title: UserRegisterRequest
      x-stoplight:
        id: cbl1zj71bt04o
      type: object
      description: Данные для регистрации нового пользователя
      examples:
